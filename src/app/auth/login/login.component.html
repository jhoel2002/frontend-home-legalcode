<!-- login.component.html -->
<div class="relative bg-gray-900 h-screen">
  <!-- Logo (sin cambios) -->
  <a
    routerLink="/"
    class="absolute top-6 right-6 flex items-center space-x-3 rtl:space-x-reverse z-50"
  >
    <img
      src="https://flowbite.com/docs/images/logo.svg"
      class="h-8"
      alt="Flowbite Logo"
    />
    <span
      class="self-center text-2xl font-semibold whitespace-nowrap text-white"
      >Flowbite</span
    >
  </a>

  <div class="flex justify-center h-full">
    <!-- Imagen decorativa (solo desktop) -->
    <div
      class="hidden bg-cover lg:block lg:w-2/3"
      style="
        background-image: url(https://images.unsplash.com/photo-1616763355603-9755a640a287?auto=format&fit=crop&w=1470&q=80);
      "
    >
      <div class="flex items-center h-full px-20 bg-gray-900/40">
        <div>
          <h2 class="text-2xl font-bold text-white sm:text-3xl">Meraki UI</h2>
          <p class="max-w-xl mt-3 text-gray-300">
            Lorem ipsum dolor sit, amet consectetur adipisicing elit. In autem
            ipsa, nulla…
          </p>
        </div>
      </div>
    </div>

    <!-- Formulario -->
    <div class="flex items-center w-full max-w-md px-6 mx-auto lg:w-2/6">
      <div class="flex-1">
        <!-- Cabecera -->
        <div class="text-center">
          <div class="flex justify-center mx-auto">
            <img
              class="w-auto h-7 sm:h-8"
              src="https://merakiui.com/images/logo.svg"
              alt=""
            />
          </div>
          <p class="mt-3 text-gray-300">
            Sign in to access your account
          </p>
        </div>

        <!-- Mensaje de error global -->
        <p
          *ngIf="errorMessage"
          class="mt-4 text-center text-sm text-red-400"
        >
          {{ errorMessage }}
        </p>

        <!-- Form reactivo -->
        <form
          class="mt-8"
          [formGroup]="loginForm"
          (ngSubmit)="onLogin()"
          novalidate
        >
          <!-- Email -->
          <div>
            <label
              for="email"
              class="block mb-2 text-sm text-gray-200"
              >Email Address</label
            >
            <input
              type="email"
              id="email"
              formControlName="email"
              placeholder="example@example.com"
              class="block w-full px-4 py-2 mt-2 border
                     rounded-lg placeholder-gray-600 bg-gray-900 text-gray-300
                     border-gray-700  focus:border-blue-400 focus:ring-blue-400
                     focus:outline-none focus:ring focus:ring-opacity-40"
            />

            <!-- Error email -->
            <p
              *ngIf="email?.touched && email?.invalid"
              class="mt-1 text-xs text-red-400"
            >
              El correo es obligatorio.
            </p>
          </div>

          <!-- Password -->
          <div class="mt-6">
            <div class="flex justify-between mb-2">
              <label
                for="password"
                class="text-sm text-gray-200"
                >Password</label
              >
              <a
                href="#"
                class="text-sm text-gray-400 focus:text-blue-500 hover:text-blue-500 hover:underline"
                >Forgot password?</a
              >
            </div>

            <input
              type="password"
              id="password"
              formControlName="password"
              placeholder="Your Password"
              class="block w-full px-4 py-2 mt-2 border
                     rounded-lg placeholder-gray-600 bg-gray-900 text-gray-300
                     border-gray-700  focus:border-blue-400 focus:ring-blue-400
                     focus:outline-none focus:ring focus:ring-opacity-40"
            />

            <!-- Error password -->
            <p
              *ngIf="password?.touched && password?.invalid"
              class="mt-1 text-xs text-red-400"
            >
              La contraseña es obligatoria.
            </p>
          </div>

          <!-- Botón -->
          <div class="mt-6">
            <button
              type="submit"
              [disabled]="loginForm.invalid || loginForm.pending"
              class="w-full px-4 py-2 tracking-wide text-white transition-colors duration-300 transform
                     bg-blue-500 rounded-lg hover:bg-blue-400 focus:outline-none disabled:opacity-50
                     focus:bg-blue-400 focus:ring focus:ring-blue-300 focus:ring-opacity-50"
            >
              Sign in
            </button>
          </div>
        </form>

        <p class="mt-6 text-sm text-center text-gray-400">
          Don&#x27;t have an account yet?
          <a
            routerLink="/register"
            class="text-blue-500 focus:outline-none focus:underline hover:underline"
            >Sign up</a
          >.
        </p>
      </div>
    </div>
  </div>
</div>
